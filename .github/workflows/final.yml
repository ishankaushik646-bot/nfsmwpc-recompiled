name: MW Cheats Final
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Apktool
        run: |
          sudo apt-get update -y
          sudo apt-get install -y apktool zipalign apksigner
          java -version
          
      - name: Build Cheats APK
        run: |
          curl -L -o original.apk https://github.com/codepdbh/nfsmwpc-recompiled/releases/download/v0.1.7/NFS_MW_v0.1.7_arm64.apk
          echo "Downloaded $(du -h original.apk)"
          
          apktool d original.apk -o patched -f
          
          # Add permission
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n</manifest>|' patched/AndroidManifest.xml
          
          # Add service
          sed -i '/<activity/a \        <service android:name="com.nfsmw.androidevolved.CheatOverlayService" android:exported="false" />' patched/AndroidManifest.xml
          
          # Create cheat service smali directly
          mkdir -p patched/smali/com/nfsmw/androidevolved
          cat > patched/smali/com/nfsmw/androidevolved/CheatOverlayService.smali << 'SMALI'
          .class public Lcom/nfsmw/androidevolved/CheatOverlayService;
          .super Landroid/app/Service;
          .method public onBind(Landroid/content/Intent;)Landroid/os/IBinder;
              const/4 v0, 0x0
              return-object v0
          .end method
          .method public onCreate()V
              .locals 5
              invoke-super {p0}, Landroid/app/Service;->onCreate()V
              const-string v0, "MW Cheats"
              const/4 v1, 0x1
              invoke-static {p0, v0, v1}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;
              move-result-object v0
              invoke-virtual {v0}, Landroid/widget/Toast;->show()V
              return-void
          .end method
          SMALI
          
          # Inject startService into LauncherActivity
          LAUNCHER=$(find patched -name "LauncherActivity.smali" | head -1)
          echo "Launcher: $LAUNCHER"
          sed -i '/\.method.*onCreate/,/return-void/ {
            /invoke-super.*onCreate/ a \
                new-instance v0, Landroid/content/Intent;\n                const-class v1, Lcom/nfsmw/androidevolved/CheatOverlayService;\n                invoke-direct {v0, p0, v1}, Landroid/content/Intent;-><init>(Landroid/content/Context;Ljava/lang/Class;)V\n                invoke-virtual {p0, v0}, Lcom/nfsmw/androidevolved/LauncherActivity;->startService(Landroid/content/Intent;)Landroid/content/ComponentName;
          }' "$LAUNCHER"
          
          apktool b patched -o unsigned.apk
          zipalign -f 4 unsigned.apk aligned.apk
          
          # Create debug keystore and sign
          keytool -genkey -v -keystore debug.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Test" -noprompt
          apksigner sign --ks debug.jks --ks-pass pass:android --key-pass pass:android --out mw-cheats-final.apk aligned.apk
          
          ls -lh *.apk
          
      - uses: actions/upload-artifact@v4
        with:
          name: MW-Cheats-APK-Final
          path: mw-cheats-final.apk
