name: MW Cheats Patch
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          
      - name: Download official APK + tools
        run: |
          wget -q https://github.com/codepdbh/nfsmwpc-recompiled/releases/download/v0.1.7/NFS_MW_v0.1.7_arm64.apk -O original.apk
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool
          echo "java -jar $(pwd)/apktool.jar \$@" > apktool.sh
          chmod +x apktool.sh
          sudo mv apktool.sh /usr/local/bin/apktool
          
      - name: Patch APK with MW button
        run: |
          apktool d original.apk -o patched --only-main-classes
          # Add permission
          sed -i 's/<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>/<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>/' patched/AndroidManifest.xml
          # Add service inside <application>
          sed -i '0,/<application/{s/<application/<application>\n        <service android:name="com.nfsmw.androidevolved.CheatOverlayService" android:enabled="true" android:exported="false" \/>/}' patched/AndroidManifest.xml || sed -i '/<application/a \        <service android:name="com.nfsmw.androidevolved.CheatOverlayService" android:enabled="true" />' patched/AndroidManifest.xml
          
          # Copy our Java file as smali (we will inject java via dex)
          mkdir -p patched/assets
          
          # Inject startService call into LauncherActivity smali
          LAUNCHER=$(find patched -name "LauncherActivity.smali" | head -1)
          echo "Found launcher: $LAUNCHER"
          if [ -f "$LAUNCHER" ]; then
            # Find onCreate and inject after super call
            sed -i '/invoke-super.*onCreate/a \    new-instance v0, Landroid/content/Intent;\n    const-class v1, Lcom/nfsmw/androidevolved/CheatOverlayService;\n    invoke-direct {v0, p0, v1}, Landroid/content/Intent;-><init>(Landroid/content/Context;Ljava/lang/Class;)V\n    invoke-virtual {p0, v0}, Lcom/nfsmw/androidevolved/LauncherActivity;->startService(Landroid/content/Intent;)Landroid/content/ComponentName;' "$LAUNCHER"
          fi
          
          # Build our cheat dex from your file
          mkdir -p /tmp/cheat_src/com/nfsmw/androidevolved
          cp [STRIPPED 70 bytes].java /tmp/cheat_src/com/nfsmw/androidevolved/ || echo "no java file, creating minimal"
          if [ ! -f /tmp/cheat_src/com/nfsmw/androidevolved/CheatOverlayService.java ]; then
          cat > /tmp/cheat_src/com/nfsmw/androidevolved/CheatOverlayService.java << 'JAVA'
          package com.nfsmw.androidevolved;
          import android.app.Service; import android.content.Intent; import android.graphics.*; import android.os.IBinder; import android.view.*; import android.widget.*;
          public class CheatOverlayService extends Service {
            WindowManager wm; LinearLayout menu; boolean vis=false;
            public static boolean neverBusted=true, instantCooldown=true, noCops=false;
            public IBinder onBind(Intent i){return null;}
            public void onCreate(){super.onCreate(); wm=(WindowManager)getSystemService(WINDOW_SERVICE); LinearLayout ov=new LinearLayout(this); ov.setOrientation(1); TextView b=new TextView(this); b.setText("MW"); b.setTextColor(-1); b.setBackgroundColor(Color.argb(180,0,150,255)); b.setPadding(50,50,50,50); b.setOnClickListener(v->{toggle();}); ov.addView(b); WindowManager.LayoutParams p=new WindowManager.LayoutParams(-2,-2,2038,8,1); p.gravity=Gravity.TOP|Gravity.START; p.x=20; p.y=200; try{wm.addView(ov,p);}catch(Exception e){}}
            void toggle(){if(vis){try{wm.removeView(menu);}catch(Exception e){}vis=false;}else{show();vis=true;}}
            void show(){menu=new LinearLayout(this); menu.setOrientation(1); menu.setBackgroundColor(Color.argb(235,25,25,25)); menu.setPadding(50,50,50,50); TextView t=new TextView(this); t.setText("MW CHEATS v0.1.11"); t.setTextColor(Color.CYAN); menu.addView(t); Switch s1=new Switch(this); s1.setText(" Never Busted"); s1.setTextColor(-1); s1.setChecked(neverBusted); s1.setOnCheckedChangeListener((a,c)->neverBusted=c); menu.addView(s1); Switch s2=new Switch(this); s2.setText(" Instant Cooldown"); s2.setTextColor(-1); s2.setChecked(instantCooldown); menu.addView(s2); Switch s3=new Switch(this); s3.setText(" No Cops"); s3.setTextColor(-1); s3.setChecked(noCops); menu.addView(s3); TextView cl=new TextView(this); cl.setText("\n[ CLOSE ]"); cl.setTextColor(Color.YELLOW); cl.setOnClickListener(v->toggle()); menu.addView(cl); WindowManager.LayoutParams p=new WindowManager.LayoutParams(750,-2,2038,8,1); p.gravity=17; try{wm.addView(menu,p);}catch(Exception e){}}
          }
          JAVA
          fi
          cd /tmp/cheat_src
          $ANDROID_HOME/build-tools/34.0.0/d8 --lib $ANDROID_HOME/platforms/android-34/android.jar --output /tmp/cheat.dex com/nfsmw/androidevolved/CheatOverlayService.java
          mkdir -p /tmp/dexout
          java -jar /usr/local/bin/../apktool.jar d /tmp/cheat.dex -o /tmp/dexout || true
          # merge smali into patched
          cp -r /tmp/dexout/smali*/com/nfsmw/androidevolved/CheatOverlayService.smali patched/smali*/com/nfsmw/androidevolved/ || mkdir -p patched/smali/com/nfsmw/androidevolved && cp /tmp/dexout/smali/com/nfsmw/androidevolved/* patched/smali/com/nfsmw/androidevolved/ || true
          
          apktool b patched -o cheats-unsigned.apk
          
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 cheats-unsigned.apk cheats-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out mw-cheats-final.apk cheats-aligned.apk
          
      - uses: actions/upload-artifact@v4
        with:
          name: MW-Cheats-APK
          path: mw-cheats-final.apk
